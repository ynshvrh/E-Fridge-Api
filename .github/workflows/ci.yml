name: Backend CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'infra/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: e_fridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and integration tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/e_fridge?sslmode=disable
          JWT_SECRET: test-secret-key-12345678901234567890
          APP_ENV: test
        run: go test -v -race -p 1 -coverprofile=coverage.txt ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -v -o bin/api ./cmd/api

  docker:
    name: Docker Build Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: e-fridge-api:test
